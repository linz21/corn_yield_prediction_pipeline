name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Lint
        run: |
          pip install ruff
          ruff check src/ tests/ --exit-zero

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate demo data and train model
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          python src/data/ingest.py --demo
          python src/features/build_features.py
          python src/models/train.py --no-bootstrap --run-name "ci-build"

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t corn-yield-api:${{ github.sha }} .

      - name: Verify image runs
        run: |
          docker run -d --name test-container -p 8000:8000 corn-yield-api:${{ github.sha }}
          sleep 5
          docker logs test-container
          docker stop test-container
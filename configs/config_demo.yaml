project:
  name: corn-yield-prediction
  author: Linlin Zhang
  github: linz21

data:
  raw_dir: data/raw
  processed_dir: data/processed
  processed_file: corn_yield_features_demo.csv
  target_col: yield_bu_per_acre
  test_size: 0.2
  val_size: 0.1
  random_seed: 42

features:
  numeric:
    - year
    - planted_acres
    - yield_bu_per_acre_lag1
    - yield_3yr_avg
    # --- Below: synthetic-data-only features, not available from USDA Quickstats ---
    # - precip_inches
    # - temp_avg_f
    # - soil_organic_matter
    # - ph_level 
    # - precip_temp_ratio
    # - heat_stress
    # - soil_quality_index
    
  categorical:
    - state
    - commodity
    # - county                 # available in real data but high cardinality — test separately

  # --- Dropped: harvested_acres ---
  # USDA Quickstats "AREA HARVESTED" has multiple conflicting values per county/year
  # (Survey vs Census estimates, e.g. 26,058 / 59,700 / 67,065 for the same record)
  # with no reliable field to disambiguate. Revisit if source_desc filtering is found.

model:
  name: xgboost
  output_path: models/latest_model_demo.pkl
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

bootstrap_pi:
  n_bootstrap: 1000
  confidence_level: 0.95

mlflow:
  tracking_uri: mlruns
  experiment_name: corn-yield-prediction

api:
  host: 0.0.0.0
  port: 8000

drift:
  reference_window_days: 90
  alert_threshold: 0.15
